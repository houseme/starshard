[package]
name = "starshard"
version = "2.3.0"
edition = "2024"
description = "A blazing-fast sharded concurrent HashMap using hashbrown and RwLock, with lazy shards, atomic length cache, async support, conditional operations, batch operations, TTL/metrics/transactions."
authors = ["houseme <housemecn@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/houseme/starshard"
homepage = "https://houseme.github.io/starshard"
documentation = "https://docs.rs/starshard"
keywords = ["concurrency", "hashmap", "hashbrown", "rwlock", "async"]
categories = ["concurrency", "data-structures"]
readme = "README.md"
resolver = "3"

[dependencies]
hashbrown = { version = "0.17.1", default-features = false }
rustc-hash = "2.1.3"
rayon = { version = "1.12.0", optional = true }
tokio = { version = "1.53.1", optional = true, default-features = false, features = ["rt", "sync"] }
serde = { version = "1.0.229", features = ["derive"], optional = true }
async-trait = { version = "0.1.92", optional = true }
tracing = { version = "0.1.44" }

[features]
default = ["rayon"]
async = ["dep:tokio", "dep:async-trait"]
rayon = ["dep:rayon", "hashbrown/rayon"]
serde = ["dep:serde", "hashbrown/serde"]
lifecycle = []
advanced = ["dep:async-trait"]
full = ["async", "rayon", "serde", "lifecycle", "advanced"]

[dev-dependencies]
tokio = { version = "1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync"] }
serde_json = "1.0.151"
async-trait = "0.1.92"
criterion = "0.8.2"
rand = "0.10.2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "bench_main"
harness = false

[[example]]
name = "snapshot_mode_clone_demo"

[[example]]
name = "snapshot_mode_cached_demo"

[[example]]
name = "snapshot_mode_cow_demo"

[[example]]
name = "mixed_workload_snapshot_tradeoff_demo"
